<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Link Redirector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="Logo" class="brand-icon">
        <div>
          <h1 class="brand-title">Link Redirector</h1>
          <span class="brand-subtitle" id="status-subtitle">Active Rules: 0</span>
        </div>
      </div>
      <div class="header-actions">
        <label class="switch" title="Toggle Master Switch">
          <input type="checkbox" id="master-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Quick Live Tester -->
    <section class="tester-card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Test Any URL</span>
      </div>
      <div class="tester-input-group">
        <input type="text" id="test-input" placeholder="e.g. originaldomain.com/aaa/bbb" spellcheck="false">
        <button id="test-btn" class="btn btn-primary" title="Simulate redirect">Test</button>
      </div>
      <div id="test-result" class="test-result hidden">
        <div class="result-row">
          <span class="label">Result:</span>
          <span id="result-status" class="badge">Redirected</span>
        </div>
        <div class="result-url" id="result-url"></div>
        <div class="result-rule" id="result-rule"></div>
      </div>
    </section>

    <!-- Rules Section -->
    <section class="rules-section">
      <div class="section-header">
        <h2 class="section-title">Your Redirect Rules</h2>
        <button id="quick-add-btn" class="btn btn-sm btn-outline">+ Add Rule</button>
      </div>

      <!-- Quick Add Form (Collapsible) -->
      <div id="quick-add-panel" class="quick-add-panel hidden">
        <h3 class="panel-title">Add Domain Swap</h3>
        <p class="panel-hint">Paths like <code>/aaa/bbb</code> are automatically preserved.</p>
        <div class="form-group">
          <label>Original Domain</label>
          <input type="text" id="new-source" placeholder="e.g. originaldomain.com" spellcheck="false">
        </div>
        <div class="form-group">
          <label>Target Domain</label>
          <input type="text" id="new-target" placeholder="e.g. newdomain.com" spellcheck="false">
        </div>
        <div class="form-actions">
          <button id="save-quick-rule-btn" class="btn btn-primary btn-sm">Save Rule</button>
          <button id="cancel-quick-rule-btn" class="btn btn-secondary btn-sm">Cancel</button>
        </div>
      </div>

      <!-- Rules List -->
      <div id="rules-list" class="rules-list">
        <!-- Rendered dynamically -->
      </div>
      <div id="empty-state" class="empty-state hidden">
        <p>No redirect rules configured.</p>
        <button id="empty-add-btn" class="btn btn-sm btn-primary">Create Your First Rule</button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="open-options-btn" class="btn btn-block btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Full Settings & Regex Rules
      </button>
    </footer>
  </div>

  <script src="../rules-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
